<!-- Reset a Stubbed password (#149). Local: supabase/config.toml.
     Hosted: paste into Authentication → Emails → Reset password.
     The link opens /auth/confirm on the web, then /reset-password. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1f1210; max-width: 480px;">
  <h2 style="font-size: 22px; margin: 0 0 12px;">Reset your password</h2>
  <p style="font-size: 16px; line-height: 24px; margin: 0 0 20px;">Tap the button to choose a new password for Stubbed. The link works once.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="display: inline-block; background: #ff7a5c; color: #1f1210; font-weight: 600; font-size: 16px; text-decoration: none; padding: 14px 24px; border-radius: 999px;">Choose a new password</a>
  </p>
  <p style="font-size: 13px; line-height: 20px; color: #5e4039; margin: 0;">If you didn’t ask for this, ignore this email; your password stays the same.</p>
</div>
