<!-- Your Stubbed password was changed (#484). Generated by scripts/emails.mjs; edit there, then run pnpm emails:build.
     Local: supabase/config.toml. Hosted: paste into Authentication → Emails → Security notifications: Password changed. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Your Stubbed password was changed</title>
</head>
<body style="margin: 0; padding: 0; background: #f2f2f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #f2f2f7;">
    <tr><td align="center" style="padding: 32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1c1c1e;">
        <tr><td style="padding: 0 0 16px;">
          <img src="{{ .SiteURL }}/brand/stubbed-mark.png" width="40" alt="" style="display: inline-block; vertical-align: middle; border: 0;">
          <span style="font-size: 20px; font-weight: 700; vertical-align: middle; padding-left: 8px; color: #1c1c1e;">Stubbed</span>
        </td></tr>
        <tr><td style="background: #ffffff; border-radius: 16px; padding: 32px 28px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr><td style="font-size: 24px; line-height: 30px; font-weight: 700; color: #1c1c1e; padding: 0 0 12px;">Your password was changed</td></tr>
          <tr><td style="font-size: 17px; line-height: 24px; color: #1c1c1e; padding: 0 0 24px;">The password for {{ .Email }} on Stubbed was just changed.</td></tr>
          
          
          <tr><td style="font-size: 13px; line-height: 20px; color: #6c6c70; border-top: 1px solid #e0e0e5; padding: 16px 0 0;">If this was you, nothing more to do. If it wasn’t, reset your password straight away from the sign-in page.</td></tr>
          </table>
        </td></tr>
        <tr><td style="font-size: 12px; line-height: 18px; color: #6c6c70; padding: 16px 0 0; text-align: center;">Stubbed, your theatre diary.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
