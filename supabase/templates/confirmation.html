<!-- Confirm a new Stubbed account (#149). Local: supabase/config.toml.
     Hosted: paste into Authentication → Emails → Confirm signup.
     The link opens /auth/confirm on the web (any browser); the code is for
     the iOS app, which asks for it after signing up. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1f1210; max-width: 480px;">
  <h2 style="font-size: 22px; margin: 0 0 12px;">Welcome to Stubbed</h2>
  <p style="font-size: 16px; line-height: 24px; margin: 0 0 20px;">Confirm your email to start your theatre diary.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup"
       style="display: inline-block; background: #ff7a5c; color: #1f1210; font-weight: 600; font-size: 16px; text-decoration: none; padding: 14px 24px; border-radius: 999px;">Confirm my email</a>
  </p>
  <p style="font-size: 15px; line-height: 22px; margin: 0 0 8px;">Signing up in the app? Enter this code:</p>
  <p style="font-size: 28px; font-weight: 700; letter-spacing: 6px; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="font-size: 13px; line-height: 20px; color: #5e4039; margin: 0;">If you didn’t sign up for Stubbed, ignore this email.</p>
</div>
