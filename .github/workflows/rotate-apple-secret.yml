name: Rotate Apple sign-in secret

# Apple's client secret for web sign-in expires after 6 months at most. This
# makes a new one from the .p8 key each month and saves it in Supabase, so it
# never runs out. Run it by hand (Actions → this workflow → Run workflow) to set
# the first secret or after changing the key. Setup: supabase/README.md, Auth.

on:
  schedule:
    - cron: "23 9 1 * *" # 09:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotate-apple-secret

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/rotate-apple-secret.mjs
        env:
          APPLE_TEAM_ID: AAW3XNQ6D3
          SUPABASE_PROJECT_REF: tvjkuzyrqsikpmryqymy
          APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
          APPLE_SERVICES_ID: ${{ vars.APPLE_SERVICES_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
