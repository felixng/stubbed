name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the build doesn't need real secrets; nothing connects at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix supabase/scripts/crawl --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test supabase/scripts/sync-wikidata.test.mjs supabase/scripts/merge.test.mjs supabase/scripts/sync-osm-venues.test.mjs supabase/scripts/crawl/*.test.mjs
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Only Postgres is needed: applies the migrations, then runs the pgTAP tests.
      - run: supabase db start
      - run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix supabase/scripts/crawl --ignore-scripts
      - name: Verify crawler stages against database and fixture pages
        run: node --test --test-concurrency=1 supabase/scripts/crawl/*-integration.test.mjs
        env:
          CRAWL_INTEGRATION_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Verify concurrent notification read snapshot
        run: bash supabase/scripts/test-notification-read-snapshot.sh
        env:
          NOTIFICATION_TEST_CONTAINER: supabase_db_stubbed
      - run: apps/ios/scripts/dev types
      - name: Check generated Swift types
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(
              ['git', 'diff', '--exit-code', '--', 'apps/ios/Stubbed/Generated/Database.swift'],
              capture_output=True, text=True,
          )
          if result.returncode:
              print(result.stderr)
              message = 'Regenerate with apps/ios/scripts/dev types.\n' + result.stdout
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error file=apps/ios/Stubbed/Generated/Database.swift::' + message)
          raise SystemExit(result.returncode)
          PY
